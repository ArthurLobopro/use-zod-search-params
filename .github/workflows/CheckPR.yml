name: Check Linter Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # These checks only read the workspace and don't depend on each other.
      - parallel:
          - name: Run Linter
            run: bun run lint

          - name: Run Build
            run: bun run build:check

          - name: Typecheck Tests
            run: bun run test:types

          - name: Run Tests
            run: bun run test
